# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-airlog"
BBFILE_PATTERN_meta-airlog = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-airlog = "6"

LAYERDEPENDS_meta-airlog = "core"
LAYERSERIES_COMPAT_meta-airlog = "scarthgap"

require conf/machine/airlog-extra.inc
